{% extends "base.html" %}
{% block title %}Femur Result{% endblock %}

{% block content %}
<div class="result-page femur-page">
    <div class="card result-card">
        <h2>Femur Length – {{ machine | upper }}</h2>

        <div class="result-details">
            <p><strong>Femur Length:</strong> {{ femur_length }} mm</p>
        </div>

        {% if image_path %}
            <img src="{{ image_path }}" class="result-image" alt="Femur Plot">
        {% endif %}
    </div>
</div>
{% endblock %}
