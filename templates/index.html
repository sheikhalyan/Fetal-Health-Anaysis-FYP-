{% extends "base.html" %}
{% block title %}Home{% endblock %}

{% block content %}
<div class="grid dashboard-grid">

    <!-- AC Card -->
    <div class="card">
        <h2>Abdominal Circumference (AC)</h2>
        <form id="acForm" method="POST" action="/ac" enctype="multipart/form-data">
            <div class="upload-zone" id="acUploadZone">
                Drag & Drop file here or click to upload
                <input type="file" name="file" id="acFileInput" required hidden>
                <span id="acFileName" class="file-name"></span>
            </div>
            <button type="submit">Analyze AC</button>
        </form>
    </div>

    <!-- BPD & HC Card -->
    <div class="card">
        <h2>Biparietal Diameter (BPD) & Head Circumference (HC)</h2>
        <form id="bpdForm" method="POST" action="/bpd" enctype="multipart/form-data">
            <div class="upload-zone" id="bpdUploadZone">
                Drag & Drop file here or click to upload
                <input type="file" name="file" id="bpdFileInput" required hidden>
                <span id="bpdFileName" class="file-name"></span>
            </div>
            <button type="submit">Analyze BPD</button>
        </form>
    </div>

    <!-- Femur Card -->
    <div class="card">
        <h2>Femur Length</h2>
        <div class="femur-buttons">
            <button onclick="redirectToMachine('volusone6')">Voluson E6</button>
            <button onclick="redirectToMachine('volusons8')">Voluson S8</button>
            <button onclick="redirectToMachine('volusons10')">Voluson S10</button>
            <button onclick="redirectToMachine('aloka')">Aloka</button>
        </div>
    </div>

</div>

<script>
// Redirect femur buttons
function redirectToMachine(machine) {
    window.location.href = "/femur?machine=" + machine;
}

// Drag & drop for AC & BPD
function setupUpload(zoneId, fileInputId, fileNameId) {
    const zone = document.getElementById(zoneId);
    const input = document.getElementById(fileInputId);
    const nameSpan = document.getElementById(fileNameId);

    zone.addEventListener('click', () => input.click());
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('hover'); });
    zone.addEventListener('dragleave', e => { e.preventDefault(); zone.classList.remove('hover'); });
    zone.addEventListener('drop', e => {
        e.preventDefault();
        zone.classList.remove('hover');
        input.files = e.dataTransfer.files;
        if (input.files.length > 0) nameSpan.textContent = input.files[0].name;
    });
    input.addEventListener('change', () => {
        if (input.files.length > 0) nameSpan.textContent = input.files[0].name;
    });
}

// Setup drag & drop
setupUpload('acUploadZone','acFileInput','acFileName');
setupUpload('bpdUploadZone','bpdFileInput','bpdFileName');

// Show loader on form submit
document.getElementById('acForm').addEventListener('submit', () => {
    document.getElementById('pageLoader').style.display = 'flex';
});
document.getElementById('bpdForm').addEventListener('submit', () => {
    document.getElementById('pageLoader').style.display = 'flex';
});
</script>
{% endblock %}
